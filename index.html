let currentThemeIndex = 0;
let currentLevel = 0;

function displayRandomPhrase() {
const randomIndex = Math.floor(Math.random() * phrases.length);
startPhraseEl.innerText = phrases[randomIndex];
}

function resizeCanvasAndEntities() {
const parent = canvas.parentElement;
canvas.width = parent.clientWidth;
canvas.height = parent.clientHeight;
playerSize = Math.min(canvas.width, canvas.height) * 0.12;
player = {
x: playerSize * 1.5,
y: canvas.height - groundHeight - playerSize / 2,
width: playerSize,
height: playerSize,
velocityY: 0,
gravity: 0.6,
jumpStrength: -20,
isJumping: false
};
ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function showMessage(text, showPrize = false, prize = '') {
messageTextEl.innerText = text;
if (showPrize) {
prizeEmojiEl.innerText = prize;
prizeEmojiEl.style.display = 'block';
} else {
prizeEmojiEl.style.display = 'none';
}
const theme = themes[currentThemeIndex];
if (theme.bg === '#0D1B2A') {
messageEl.style.color = '#FDF6E3';
} else {
messageEl.style.color = '#4A4A4A';
}
messageEl.style.display = 'flex';
setTimeout(() => {
hideMessage();
}, 1500);
}
function hideMessage() {
messageEl.style.display = 'none';
}

const savingsAmountEl = document.getElementById('savingsAmount');
const savingsFillEl = document.getElementById('savingsFill');
const bestScoreEl = document.getElementById('bestScore');
const gameOverPanel = document.getElementById('gameOverPanel');
const goTitleEl = document.getElementById('goTitle');
const goSavingsEl = document.getElementById('goSavings');
const goIdeaEl = document.getElementById('goIdea');

function formatColones(n) {
return '₡' + Math.round(n).toLocaleString('es-CR');
}

function updateSavingsUI() {
savingsAmountEl.innerText = formatColones(savings);
savingsFillEl.style.width = Math.min(100, (savings / SAVINGS_GOAL) * 100) + '%';
}

function recommendIdea(amount) {
let pool;
if (amount < 60000) {
pool = ideas.filter(i => i.startsWith('🛡️'));
} else if (amount < 150000) {
pool = ideas.filter(i => i.startsWith('🏠') || i.startsWith('📚') || i.startsWith('💻'));
} else {
pool = ideas.filter(i => i.startsWith('📈'));
}
if (!pool || pool.length === 0) pool = ideas;
return pool[Math.floor(Math.random() * pool.length)];
}

function showGameOver(won) {
gameOver = true;
if (score > bestScore) {
bestScore = Math.floor(score);
try { localStorage.setItem('aguinaldo_best', String(bestScore)); } catch (e) {}
}
bestScoreEl.innerText = Math.floor(bestScore);
goTitleEl.innerText = won ? '¡Llegaste a la meta! 🎉' : '¡Perdiste! Pero algo lograste ahorrar…';
goSavingsEl.innerText = 'Ahorraste ' + formatColones(savings);
goIdeaEl.innerText = savings > 0
? 'Idea para invertirlo: ' + recommendIdea(savings)
: 'Recoge 💰 en tu próximo intento para juntar tu aguinaldo.';
gameOverPanel.style.display = 'flex';
}

function drawCoins() {
coins.forEach(coin => {
ctx.font = `${coin.size}px sans-serif`;
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('💰', coin.x, coin.y);
});
}

function spawnCoins() {
const ground = canvas.height - groundHeight;
const size = playerSize * 0.7;
const count = 1 + Math.floor(Math.random() * 3);
const lowest = ground - player.height * 0.8;
const highest = ground - player.height * 2.5;
const baseY = lowest + Math.random() * (highest - lowest);
for (let i = 0; i < count; i++) {
coins.push({
x: canvas.width + i * size * 1.6,
y: baseY - Math.sin((i / Math.max(1, count - 1)) * Math.PI) * size * 1.2,
size: size,
collected: false
});
}
}

function resetGame() {
cancelAnimationFrame(gameLoopId);
obstacles = [];
coins = [];
gameSpeed = 4;
score = 0;
coinsCollected = 0;
savings = 0;
gameOver = false;
gameStarted = false;
lastObstacleTime = 0;
lastCoinTime = 0;
currentThemeIndex = 0;
currentLevel = 0;
gameOverPanel.style.display = 'none';
updateSavingsUI();
bestScoreEl.innerText = Math.floor(bestScore);
displayRandomPhrase();
prizeEmojiEl.style.display = 'none';
messageTextEl.innerText = 'Toca o pulsa espacio para saltar\ny recoge las 💰';
messageEl.style.color = '#386641';
messageEl.style.textShadow = '0 0 6px rgba(255,255,255,0.95), 0 0 6px rgba(255,255,255,0.95)';
messageEl.style.display = 'flex';
lastFrameTime = 0;
gameLoop();
}

function handleJump() {
if (!gameStarted) {
gameStarted = true;
hideMessage();
}
if (!player.isJumping && !gameOver && !isParadeActive) {
player.velocityY = player.jumpStrength;
player.isJumping = true;
}
}

function primaryAction() {
if (isParadeActive) return;
if (gameOver) {
resetGame();
} else {
handleJump();
}
}

canvas.addEventListener('click', (e) => {
e.preventDefault();
primaryAction();
});

canvas.addEventListener('touchstart', (e) => {
e.preventDefault();
primaryAction();
}, { passive: false });

gameOverPanel.addEventListener('click', (e) => {
e.preventDefault();
if (!isParadeActive) resetGame();
});

document.body.addEventListener('keydown', (e) => {
if (e.code === 'Space' || e.code === 'ArrowUp') {
e.preventDefault();
primaryAction();
}
});

function drawPlayer() {
const theme = themes[currentThemeIndex];
ctx.font = `${player.height}px sans-serif`;
ctx.textAlign = "center"
ctx.textBaseline = "middle"
// Fix 1: Flip the player to face the obstacles
ctx.save();
ctx.translate(player.x, player.y);
ctx.scale(-1, 1);
ctx.fillText(theme.player, 0, 0);
ctx.restore();
}
const paradeCharacters = themes.map(t => t.player);
let paradePositions = paradeCharacters.map(() => -200); // Start off-screen
function paradeLoop() {
if (!isParadeActive) {
return;
}
ctx.clearRect(0, 0, canvas.width, canvas.height);
canvas.style.backgroundColor = '#0D1B2A';
ctx.fillStyle = '#FDF6E3';
ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);

let allCharactersOffScreen = true;
for (let i = 0; i < paradeCharacters.length; i++) {
if (paradePositions[i] < canvas.width + playerSize) {
allCharactersOffScreen = false;
const position = paradePositions[i];
ctx.font = `${playerSize}px sans-serif`;
ctx.textAlign = "center"
ctx.textBaseline = "middle"
ctx.fillText(paradeCharacters[i], position, canvas.height - groundHeight - playerSize / 2);
paradePositions[i] += 5;
}
}
paradeLoopId = requestAnimationFrame(paradeLoop);
}

function endParade() {
isParadeActive = false;
cancelAnimationFrame(paradeLoopId);
hideMessage();
savings += 100000; // bono por completar el recorrido
updateSavingsUI();
showGameOver(true);
}

function startParade() {
isParadeActive = true;
messageEl.style.color = '#FDF6E3';
messageEl.style.textShadow = 'none';
messageEl.style.display = 'flex';
messageTextEl.innerText = "NelSystems agradece por jugar y esperamos lo hayas disfrutado!"
paradePositions = paradeCharacters.map((_, i) => -200 * (i + 1));
paradeLoop();

setTimeout(() => {
endParade();
}, 7000);
}

function drawObstacles() {
const theme = themes[currentThemeIndex];
obstacles.forEach(obstacle => {
ctx.font = `${obstacle.height}px sans-serif`;
ctx.textAlign = "center"
ctx.textBaseline = "middle"
ctx.fillText(theme.obstacle, obstacle.x, obstacle.y);
});
}

function drawGround() {
const theme = themes[currentThemeIndex];
canvas.style.backgroundColor = theme.bg;
ctx.fillStyle = (currentLevel >= 6) ? '#FDF6E3' : '#A68A64';
ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
ctx.fillStyle = (currentLevel >= 6) ? '#FDF6E3' : '#386641';
for (let i = 0; i < canvas.width / 15; i++) {
ctx.fillRect(i * 15 + (score % 15), canvas.height - groundHeight - 5, 5, 5);
}
}

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
return (Math.abs(ax - bx) * 2 < (aw + bw)) && (Math.abs(ay - by) * 2 < (ah + bh));
}
function displayLevelMessage(level, prize) {
const theme = themes[currentThemeIndex];
messageTextEl.innerText = `¡Nivel ${level}!\n\nPremio:\n${prize}`;
if (theme.bg === '#0D1B2A') {
messageEl.style.color = '#FDF6E3';
} else {
messageEl.style.color = '#4A4A4A';
}
messageEl.style.textShadow = 'none';
messageEl.style.display = 'flex';
setTimeout(() => {
hideMessage();
}, 1500);
}

// Fix 2: Use delta time to normalize game speed
function gameLoop(currentTime) {
gameLoopId = requestAnimationFrame(gameLoop);
const now = currentTime || performance.now();
if (!lastFrameTime) lastFrameTime = now;
let deltaTime = now - lastFrameTime;
lastFrameTime = now;
if (!deltaTime || deltaTime < 0) deltaTime = 16.67;
if (deltaTime > 50) deltaTime = 50; // clamp al volver de otra pestaña
const dt = deltaTime / 16.67; // factor de frame (1 = 60fps)
if (gameOver || isParadeActive) {
return;
}
ctx.clearRect(0, 0, canvas.width, canvas.height);
drawGround();
if (gameStarted) {
player.velocityY += player.gravity * dt;
player.y += player.velocityY * dt;
if (player.y >= canvas.height - groundHeight - player.height / 2) {
player.y = canvas.height - groundHeight - player.height / 2;
player.velocityY = 0;
player.isJumping = false;
}
const newLevel = Math.floor(score / 500);
if (newLevel > currentLevel) {
currentLevel = newLevel;
if (currentLevel >= 10) {
startParade();
return;
}
currentThemeIndex = Math.min(newLevel, themes.length - 1);
const prizeIndex = currentLevel % prizeEmojis.length;
displayLevelMessage(currentLevel + 1, prizeEmojis[prizeIndex]);
}

// Obstáculos: intervalo acotado para que nunca sea imposible
const obstacleInterval = Math.max(750, 1900 - (gameSpeed - 4) * 130);
if (Date.now() - lastObstacleTime > obstacleInterval) {
if (Math.random() < 0.5) {
const h = playerSize * 0.8;
obstacles.push({
x: canvas.width,
y: canvas.height - groundHeight - h / 2,
width: h,
height: h
});
lastObstacleTime = Date.now();
}
}

// Monedas
if (Date.now() - lastCoinTime > 1400) {
if (Math.random() < 0.7) {
spawnCoins();
lastCoinTime = Date.now();
}
}

const step = gameSpeed * dt;

for (let i = obstacles.length - 1; i >= 0; i--) {
const obstacle = obstacles[i];
obstacle.x -= step;
if (obstacle.x + obstacle.width / 2 < 0) {
obstacles.splice(i, 1);
continue;
}
// hitbox con perdón: 60% del tamaño visible
if (rectsOverlap(player.x, player.y, player.width * 0.6, player.height * 0.6,
obstacle.x, obstacle.y, obstacle.width * 0.6, obstacle.height * 0.6)) {
showGameOver(false);
return;
}
}

for (let i = coins.length - 1; i >= 0; i--) {
const coin = coins[i];
coin.x -= step;
if (coin.x + coin.size / 2 < 0) {
coins.splice(i, 1);
continue;
}
if (rectsOverlap(player.x, player.y, player.width * 0.8, player.height * 0.8,
coin.x, coin.y, coin.size * 0.9, coin.size * 0.9)) {
coins.splice(i, 1);
coinsCollected++;
savings += COIN_VALUE;
updateSavingsUI();
continue;
}
}

drawObstacles();
drawCoins();
score += dt;
gameSpeed += 0.00075 * dt;
ctx.fillStyle = (currentLevel >= 6) ? '#FDF6E3' : '#A68A64';
ctx.font = '16px Poppins';
ctx.textAlign = 'left';
ctx.textBaseline = 'alphabetic';
ctx.fillText(`Puntaje: ${Math.floor(score)}`, 10, 20);
ctx.textAlign = 'right';
ctx.fillText(`💰 ${coinsCollected}`, canvas.width - 10, 20);
}
drawPlayer();
}

// --- Calculadora de Aguinaldo ---
const mesesCalc = [
  "Noviembre", "Diciembre", "Enero", "Febrero", "Marzo", "Abril",
  "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Salario Escolar"
];
let datosCalc = [];
let indiceCalc = 0;

function guardarDato() {
  const input = document.getElementById("calcInput");
  const valor = parseFloat(input.value);

  if (isNaN(valor) || valor <= 0) {
    alert("Por favor ingrese un monto válido.");
    return;
  }

  datosCalc.push(valor);
  input.value = "";

  indiceCalc++;
  if (indiceCalc < mesesCalc.length) {
    document.getElementById("calcInstruction").innerText =
      "Ingrese su devengado de " + mesesCalc[indiceCalc] + ":";
  } else {
    calcularAguinaldo();
  }
}

function calcularAguinaldo() {
  const suma = datosCalc.reduce((acc, val) => acc + val, 0);
  const aguinaldo = suma / 12;
  document.getElementById("calcInstruction").innerText = "";
  document.getElementById("calcInput").style.display = "none";
  document.getElementById("calcButton").style.display = "none";
  document.getElementById("calcResult").innerText =
    "🎉 Felicidades recibirás un Aguinaldo de: " + aguinaldo.toFixed(2) + " colones";
}
